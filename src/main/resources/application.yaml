storage:
  jdbc-url: jdbc:postgresql://localhost:5432/provve
  username: postgres
  password: 1

s3:
  # where objects are stored
  buckets:
    # public read
    images: i4s
    # archives with exams, private
    archives: e3s
    # archives with solutions, private
    solutions: s7s
  credentials:
    url: http://localhost:19000
    access-key: 1
    secret-key: 1
    region: ru-msk
antifraud:
  legit-check:
    pubkey: ${legit_pub}
  trust-token:
    secret: ${trust_secret}
    expires-in-seconds: 86400 # сутки
security:
  jwt:
    auth:
      secret: ${auth_secret}
      expires-in-seconds: 86400 # сутки
    reset:
      secret: ${reset_secret}
      expires-in-seconds: 300 # 5 минут
mail:
  host: localhost
  port: 1025
  username: support@provve.tech
  password: ${mail_password}
premium-price: 20000 # в рублях
robokassa:
  merchant-login: ${merchant_login}
  jwt-secret: "${merchant_login}:${shop_password_1}"
