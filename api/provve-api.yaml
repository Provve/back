openapi: "3.0.4" # такая версия из-за неподдерживаемости vertx web openapi
info:
  title: Provve API
  version: "0.0.1"
servers:
  - url: http://localhost:8080/api/v1
  - url: https://provve.tech/api/v1
tags:
  - name: accounts
  - name: notifications
  - name: skills
  - name: votes
  - name: sessions
  - name: payments

paths:
  /accounts:
    post:
      tags:
        - accounts
      summary: Регистрация пользователя
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAccount.request'
      responses:
        '200':
          description: Успешная регистрация
        '400':
          $ref: "#/components/responses/ValidationError"
        '409':
          description: Пользователь уже существует
    delete:
      tags:
        - accounts
      summary: Удаление аккаунта и связанных персональных данных
      operationId: deleteAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccount.request'
      responses:
        '200':
          description: Аккаунт удален
        '400':
          $ref: "#/components/responses/ValidationError"

  /auth:
    post:
      tags:
        - accounts
      summary: Аутентификация пользователя
      operationId: authenticateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateUser.request'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '400':
          $ref: "#/components/responses/ValidationError"
        '404':
          description: Пользователь не найден
        '403':
          description: Аккаунт существует, но данные неверны

  /upgrade:
    get:
      tags:
        - accounts
      summary: Запустить процесс получения статуса платного аккаунта
      operationId: upgradeAccount
      parameters:
        - name: login
          in: query
          required: true
          schema:
            type: string
          description: Логин повышаемого аккаунта
      responses:
        '200':
          description: Транзакция создана
          content:
            text/plain:
              schema:
                type: string
                description: URL на оплату
        '404':
          description: Пользователя не существует
        '409':
          description: Пользователь уже повысил аккаунт
        '504':
          description: Платёжный шлюз недоступен

  /robokassa-payment-confirm:
    post:
      summary: Подтвердить успешную оплату для Robokassa
      tags:
        - payments
      operationId: confirmPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RobokassaConfirmPayment.request"
      responses:
        '200':
          description: Подписи совпали
          content:
            text/plain:
              schema:
                type: string
                description: https://docs.robokassa.ru/ru/notifications-and-redirects#resulturl
                example: |
                  OK{InvId}
                  OK5
        '400':
          description: Подписи не совпали

  /email:
    put:
      summary: Изменение почты аккаунта
      tags:
        - accounts
      operationId: updateEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmail.request'
      responses:
        '200':
          $ref: "#/components/responses/DataWritten"
        '400':
          $ref: "#/components/responses/ValidationError"
        '401':
          $ref: "#/components/responses/Unauthenticated"
        '403':
          $ref: "#/components/responses/NoPersonalDataConsent"
        '409':
          $ref: "#/components/responses/DataNotUnique"
      security:
        - auth: [ ]

  /password:
    put:
      summary: Обновление пароля аккаунта
      tags:
        - accounts
      operationId: updatePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePassword.request'
      responses:
        '200':
          description: Пароль успешно обновлён
        '400':
          $ref: "#/components/responses/ValidationError"
        '401':
          $ref: "#/components/responses/Unauthenticated"
      security:
        - reset: [ ]

  /avatar:
    put:
      summary: Обновление аватара аккаунта
      tags:
        - accounts
      operationId: updateAvatar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAvatar.request'
      responses:
        '200':
          $ref: "#/components/responses/DataWritten"
        '400':
          $ref: "#/components/responses/ValidationError"
        '401':
          $ref: "#/components/responses/Unauthenticated"
        '403':
          $ref: "#/components/responses/NoPersonalDataConsent"
        '409':
          $ref: "#/components/responses/DataNotUnique"
      security:
        - auth: [ ]

  /contacts:
    put:
      summary: Обновление контактных данных
      tags:
        - accounts
      operationId: updateContacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContacts.request'
      responses:
        '200':
          $ref: "#/components/responses/DataWritten"
        '401':
          $ref: "#/components/responses/Unauthenticated"
      security:
        - auth: [ ]

  /pd-consent:
    put:
      summary: Согласие с Политикой обработки персональных данных (ПД)
      tags:
        - accounts
      operationId: updatePersonalDataConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonalDataConsent.request'
      responses:
        '200':
          $ref: "#/components/responses/DataWritten"
        '400':
          $ref: "#/components/responses/ValidationError"
        '401':
          $ref: "#/components/responses/Unauthenticated"
      security:
        - auth: [ ]

  /reset-code:
    get:
      summary: Запросить код сброса пароля на email
      tags:
        - accounts
      operationId: requestResetCode
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Код отправлен на email
        '400':
          $ref: "#/components/responses/ValidationError"
        '404':
          description: На почту не зарегистрирован ни один аккаунт

  /session:
    post:
      tags:
        - sessions
      summary: Создать сессию
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession.request'
      responses:
        '200':
          description: Сессия начата
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSession.response"
        '401':
          $ref: "#/components/responses/Unauthenticated"
        '404':
          description: Указанный экзамен не найден
        '409':
          description: Дважды пройти экзамен нельзя
      security:
        - auth: [ ]

  /observation:
    post:
      summary: Загрузить результат наблюдения
      tags:
        - sessions
      operationId: uploadObservation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "build/specs/antifraud-api.yaml#/components/schemas/ObservationUpload.request"
      responses:
        '200':
          description: Данные наблюдения загружены
          content:
            application/json:
              schema:
                $ref: "build/specs/antifraud-api.yaml#/components/schemas/ObservationUpload.response"
        '400':
          description: Результат наблюдения отрицательный
        '401':
          $ref: "#/components/responses/Unauthenticated"
        '403':
          description: Легитимность Антифрода не доказана
      security:
        - auth: [ ]

  /skills:
    post:
      tags:
        - skills
      summary: Получение списка навыков
      operationId: listSkills
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Collection.request"
      responses:
        '200':
          description: Успешно получен список навыков
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skills"
        '400':
          $ref: "#/components/responses/ValidationError"

  /skills/{skill_name}/exams:
    post:
      tags:
        - skills
      summary: Получение списка экзаменов по навыку
      operationId: listExams
      parameters:
        - name: skill_name
          in: path
          required: true
          schema:
            type: string
            description: ID навыка
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Collection.request"
      responses:
        '200':
          description: Успешно получен список экзаменов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exams"
        '400':
          $ref: "#/components/responses/ValidationError"

  /exams/{exam_name}/solution:
    post:
      tags:
        - skills
      summary: Отправка решения экзамена на проверку
      operationId: submitExamSolution
      parameters:
        - name: exam_name
          in: path
          required: true
          schema:
            type: string
          description: ID экзамена, для которой отправляется решение
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitExamSolution.request'
      responses:
        '202':
          description: Решение успешно принято на проверку
        '200':
          description: Приниято. Система уведомила Пользователя об активном голосовании на удаление навыка, предупредив, что результат по экзамена может быть удален ввиду удаления родительского навыка.
        '401':
          $ref: "#/components/responses/Unauthenticated"
      security:
        - trust: [ ]

  /skills/{skill_name}/results:
    post:
      summary: Получение результатов по экзаменам навыка.
      tags:
        - skills
      operationId: listResults
      parameters:
        - name: skill_name
          in: path
          required: true
          schema:
            type: string
            description: ID навыка
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionAuthenticated.request"
      responses:
        '200':
          description: Список результатов успешно получен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Results"
        '400':
          $ref: "#/components/responses/ValidationError"
        '401':
          $ref: "#/components/responses/Unauthenticated"
      security:
        - auth: [ ]

  /exams/{exam_name}/result:
    get:
      summary: Посмотреть результат
      tags:
        - skills
      operationId: getExamResult
      parameters:
        - name: exam_name
          in: path
          required: true
          schema:
            type: string
          description: ID экзамена, результат по которому нужно получить
      responses:
        '200':
          description: Результат получен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result.response"
        '401':
          $ref: "#/components/responses/Unauthenticated"
        '403':
          description: Уровень аккаунта не позволяет
        '404':
          description: Результат не найден (был удалён или неверная ссылка)
      security:
        - auth: [ ]

  /votes:
    post:
      summary: Получить список голосований
      tags:
        - votes
      operationId: listVotes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Collection.request"
      responses:
        '200':
          description: Получены голосования
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Votes"
        '400':
          $ref: "#/components/responses/ValidationError"

  /votes/skill-add:
    post:
      tags:
        - votes
      summary: Создать голосование на добавление навыка
      operationId: createSkillAddVote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillAddVote'
      responses:
        '200':
          description: Голосование успешно создано
        '400':
          $ref: "#/components/responses/ValidationError"
        '401':
          $ref: "#/components/responses/Unauthenticated"
        '409':
          $ref: "#/components/responses/DataNotUnique"
      security:
        - auth: [ ]

  /votes/skill-del:
    post:
      tags:
        - votes
      summary: Создать голосование на удаление навыка
      operationId: createSkillDelVote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillDelVote'
      responses:
        '200':
          description: Голосование успешно создано
        '400':
          $ref: "#/components/responses/ValidationError"
        '401':
          $ref: "#/components/responses/Unauthenticated"
        '409':
          $ref: "#/components/responses/DataNotUnique"
      security:
        - auth: [ ]

  /votes/exam-add:
    post:
      tags:
        - votes
      summary: Создать голосование на добавление экзамена
      operationId: createExamAddVote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamAddVote'
      responses:
        '202':
          description: Голосование будет создано, пользователь получит уведомление
        '400':
          $ref: "#/components/responses/ValidationError"
        '401':
          $ref: "#/components/responses/Unauthenticated"
        '404':
          description: Связанный навык не найден
        '409':
          $ref: "#/components/responses/DataNotUnique"
      security:
        - auth: [ ]

  /votes/{name}/voting:
    post:
      tags:
        - votes
      summary: Проголосовать
      operationId: castVote
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: ID голосавания, за который отдаётся голос
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CastVote.request'
      responses:
        '200':
          description: Голос учтен
        '400':
          $ref: "#/components/responses/ValidationError"
        '401':
          $ref: "#/components/responses/Unauthenticated"
        '403':
          description: Авторам запрещено голосовать
        '404':
          description: Голосование не найдено
        '409':
          $ref: "#/components/responses/DataNotUnique"
      security:
        - auth: [ ]

  /votes/{vote_name}/comments:
    get:
      summary: Получить комментарии к голосованию
      tags:
        - votes
      operationId: listComments
      parameters:
        - name: vote_name
          in: path
          required: true
          schema:
            type: string
          description: ID голосования
      responses:
        '200':
          description: Получен список комментариев
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comments"
        '400':
          $ref: "#/components/responses/ValidationError"
        '401':
          $ref: "#/components/responses/Unauthenticated"
    post:
      summary: Добавление комментария к голосованию
      tags:
        - votes
      operationId: addComment
      parameters:
        - name: vote_name
          in: path
          required: true
          schema:
            type: string
          description: ID голосования
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddComment.request'
      responses:
        '200':
          description: Комментарий успешно добавлен
        '400':
          $ref: "#/components/responses/ValidationError"
        '401':
          $ref: "#/components/responses/Unauthenticated"
      security:
        - auth: [ ]

  /votes/{vote_name}/comments/{comment_id}:
    put:
      summary: Редактирование комментария к голосованию
      tags:
        - votes
      operationId: editComment
      parameters:
        - name: vote_name
          in: path
          required: true
          schema:
            type: string
          description: ID голосования
        - name: comment_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
          description: ID комментария
      responses:
        '200':
          description: Комментарий успешно отредактирован
        '400':
          $ref: "#/components/responses/ValidationError"
        '401':
          $ref: "#/components/responses/Unauthenticated"
        '403':
          description: Вы не автор комментария!
      security:
        - auth: [ ]
    delete:
      summary: Удаление комментария к голосованию
      tags:
        - votes
      operationId: deleteComment
      parameters:
        - name: vote_name
          in: path
          required: true
          schema:
            type: string
          description: ID голосования
        - name: comment_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
          description: ID комментария
      responses:
        '200':
          description: Комментарий успешно удалён
        '401':
          $ref: "#/components/responses/Unauthenticated"
        '403':
          description: Вы не автор комментария!
      security:
        - auth: [ ]

  /notifications:
    post:
      summary: Получение уведомлений
      tags:
        - notifications
      operationId: listNotifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionAuthenticated.request"
      responses:
        '200':
          description: Список уведомлений успешно получен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notifications"
        '400':
          $ref: "#/components/responses/ValidationError"
        '401':
          $ref: "#/components/responses/Unauthenticated"
      security:
        - auth: [ ]
    delete:
      summary: Очистить список уведомлений
      tags:
        - notifications
      operationId: clearNotifications
      responses:
        '200':
          description: Очищено
        '401':
          $ref: "#/components/responses/Unauthenticated"
      security:
        - auth: [ ]

components:
  parameters:
    Filter:
      name: filter
      in: query
      explode: true
      schema:
        $ref: "#/components/schemas/Filter"
    Pagination:
      name: pagination
      in: query
      required: true
      explode: true
      schema:
        $ref: "#/components/schemas/Pagination"
  responses:
    DataWritten:
      description: Данные успешно обновлены
    NoPersonalDataConsent:
      description: Эти данные нельзя записывать без согласия пользователя на обработку ПД
    DataNotUnique:
      description: Данные не удовлетворяют требованию уникальности
    ValidationError:
      description: Ошибка валидации данных
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Error"

    Unauthenticated:
      description: Следует пройти аутентификацию
  schemas:
    Filter:
      type: object
      properties:
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
    Condition:
      type: object
      properties:
        field:
          type: string
          description: Фильтруемое поле
        operator:
          type: string
          enum: [ EQ, LIKE ]
        value:
          type: string
          description: Желаемое значение поля
      required:
        - field
        - operator
        - value
    Pagination:
      type: object
      required:
        - previous
        - size
      properties:
        previous:
          type: string
          description: ID последнего элемента предыдущей страницы
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Требуемый размер страницы

    Cursor:
      description: Указатель на последний элемент предыдущей страницы
      type: object
      required:
        - previous
      properties:
        previous:
          type: string
          description: ID последнего элемента страницы

    Skills:
      type: object
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill.response"
        cursor:
          $ref: "#/components/schemas/Cursor"

    Skill.response:
      type: object
      properties:
        name:
          type: string
          description: Название навыка
        tags:
          $ref: "#/components/schemas/Tags"
      required:
        - name
        - tags

    Exams:
      type: object
      properties:
        exams:
          type: array
          items:
            $ref: "#/components/schemas/Exam.response"
        cursor:
          $ref: "#/components/schemas/Cursor"

    Exam.response:
      type: object
      properties:
        name:
          type: string
          description: Используется как ID
        description:
          type: string
          description: Описание для пользователей
        public_archive_url:
          type: string
          description: Проверяемая часть экзамена, задание

    Results:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Result.response"
        cursor:
          $ref: "#/components/schemas/Cursor"

    Result.response:
      description: Успешный результат
      type: object
      properties:
        exam_name:
          type: string
          description: ID экзамена, по которому получен результат
        time:
          description: Затраченное время, в минутах
          type: integer
          format: int64

    Vote:
      description: Простая форма голосования
      type: object
      properties:
        name:
          type: string
          description: Название голосования. Он же и id объекта голосования.
        arguments:
          type: string
          description: Аргументы за совершение действия, предложенного в голосовании.
        tags:
          $ref: "#/components/schemas/Tags"

    Vote.request:
      allOf:
        - $ref: "#/components/schemas/Vote"
        - type: object
          properties:
            auth_token:
              $ref: "#/components/schemas/AuthToken"

    SkillAddVote:
      allOf:
        - $ref: '#/components/schemas/Vote.request'

    SkillDelVote:
      allOf:
        - $ref: '#/components/schemas/Vote.request'

    ExamAddVote:
      allOf:
        - $ref: '#/components/schemas/Vote.request'
        - type: object
          properties:
            skill_name:
              type: string
              description: ID навыка, для проверки которого добавляют экзамен
            description:
              type: string
              maxLength: 3000
              description: Финальная постановка задания для экзаменуемых
            public_archive:
              type: string
              format: binary
              description: Проверяемая часть экзамена, задание
            private_archive:
              type: string
              format: binary
              description: Проверяющая часть экзамена
          required:
            - skill_name
            - description
            - public_archive
            - private_archive

    Votes:
      type: object
      properties:
        votes:
          type: array
          items:
            $ref: "#/components/schemas/Vote.response"
        cursor:
          $ref: "#/components/schemas/Cursor"

    Vote.response:
      description: Всеохватывающее представление голосования
      allOf:
        - $ref: '#/components/schemas/Vote'
        - type: object
          properties:
            type:
              type: string
              enum: [ add_skill, del_skill, add_exam ]
              description: |
                add_skill — добавление навыка,
                del_skill — удаление навыка,
                add_exam — добавление экзамена
            reactions:
              type: object
              description: Голоса
              properties:
                positive:
                  type: integer
                  format: int32
                negative:
                  type: integer
                  format: int32
            deadline:
              type: string
              format: date-time
              description: Конечный срок, когда голосование закроется, будет подсчитан результат и совершенно действие.
              example: '2025-12-31T23:59:59Z'
            exam_add:
              $ref: "#/components/schemas/ExamAddVote.response"
          required:
            - type
            - reactions
            - deadline

    ExamAddVote.response:
      type: object
      properties:
        skill_name:
          type: string
          description: ID навыка, для проверки которого добавляют экзамен
        description:
          type: string
          description: Финальная постановка задания для экзаменуемых
        public_archive_url:
          type: string
          description: Проверяемая часть экзамена, задание
      required:
        - skill_name
        - description
        - public_archive_url

    Comments:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment.response"

    Comment.response:
      type: object
      properties:
        author:
          $ref: "#/components/schemas/Profile.response"
          description: Автор комментария
        content:
          type: string
        id:
          type: integer
          format: int32
          description: ID комментария
    Profile.response:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: d8cbb1f0-f4eb-46b4-b1b6-c0a670544254
          description: Id профиля
        avatar_url:
          type: string
          description: URL на аватар профиля
        username:
          type: string
          description: Отображаемое имя профиля

    Notifications:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        cursor:
          $ref: "#/components/schemas/Cursor"

    Notification:
      type: object
      description: Уведомление о событии в системе
      properties:
        id:
          description: ID уведомления
          type: integer
          format: int32
        level:
          description: Уровень важности
          type: string
          enum:
            - error
            - warning
            - info
        message:
          type: string
          description: |
            Содержимое, HTML
            examples:
              - Идёт <a href="/votes/1">голосование</a> за удаление
              - Антифрод неподлинный
        created_at:
          type: string
          format: date-time

    Collection.request:
      type: object
      properties:
        pagination:
          $ref: "#/components/schemas/Pagination"
        filter:
          $ref: "#/components/schemas/Filter"
      required:
        - pagination

    CollectionAuthenticated.request:
      allOf:
        - $ref: "#/components/schemas/Collection.request"
        - type: object
          properties:
            auth_token:
              $ref: "#/components/schemas/AuthToken"
          required:
            - auth_token

    RegisterAccount.request:
      type: object
      properties:
        login:
          type: string
          description: Уникальный логин пользователя
        email:
          type: string
          description: Для восстановления пароля и рассылок
        password:
          type: string
          description: Пароль
        consent_personal_data:
          type: boolean
          description: Согласен ли пользователь на обработку персональных данных
        username:
          type: string
          description: Отображаемое имя аккаунта
      required:
        - login
        - password
        - consent_personal_data
        - username

    DeleteAccount.request:
      type: object
      required:
        - auth_token
      properties:
        auth_token:
          $ref: "#/components/schemas/AuthToken"

    AuthenticateUser.request:
      type: object
      properties:
        login:
          type: string
        password:
          type: string
      required: [ login, password ]

    UpdateEmail.request:
      type: object
      required:
        - email
        - auth_token
      properties:
        email:
          type: string
          description: Новая почта аккаунта
        auth_token:
          $ref: "#/components/schemas/AuthToken"

    UpdatePassword.request:
      type: object
      required:
        - new_password
      properties:
        reset_token:
          type: string
          description: Токен для сброса пароля, отправленный пользователю на почту. Используется для извлечения логина
        new_password:
          type: string
          description: Новый пароль

    UpdateAvatar.request:
      type: object
      required:
        - avatar
        - auth_token
      properties:
        avatar:
          type: string
          format: binary
        auth_token:
          $ref: "#/components/schemas/AuthToken"

    UpdateContacts.request:
      type: object
      required:
        - contacts
        - auth_token
      properties:
        contacts:
          $ref: "#/components/schemas/Contacts"
        auth_token:
          $ref: "#/components/schemas/AuthToken"

    Contacts:
      type: object
      properties:
        URLs:
          type: array
          items:
            type: string
          description: Произвольные URL для связи

    UpdatePersonalDataConsent.request:
      type: object
      required:
        - auth_token
        - consent_personal_data
      properties:
        consent_personal_data:
          type: boolean
        auth_token:
          $ref: "#/components/schemas/AuthToken"

    CreateSession.request:
      type: object
      properties:
        exam_name:
          type: string
          description: ID экзамена
        redirect:
          type: string
          format: uri
          description: Адрес переадрессации на локальный сервер Антифрода.
        auth_token:
          $ref: "#/components/schemas/AuthToken"
      required:
        - exam_name
        - redirect
        - auth_token

    CreateSession.response:
      type: object
      properties:
        redirect:
          type: string
          format: uri
        loss_risk:
          type: boolean
          description: Идёт голосование за удаление навыка, но сессия создана и пользователь может начинать экзамен на свой риск.
        nonce:
          type: string
          description: Случайное значение для алгоритма проверки легитимности Антифрода.

    SubmitExamSolution.request:
      type: object
      properties:
        solution:
          type: string
          format: binary
          description: Архив с решением
        trust_token:
          type: string
          description: Доверительный токен подтверждает, что перенаправление осуществлено от легитимного Антифрода и наблюдение показало отсутствие нарушений.
      required:
        - solution
        - trust_token

    CastVote.request:
      type: object
      properties:
        positive_reaction:
          type: boolean
          description: true — за, false — против
        auth_token:
          $ref: "#/components/schemas/AuthToken"
      required:
        - positive_reaction
        - auth_token

    AddComment.request:
      type: object
      required:
        - comment
      properties:
        comment:
          type: string
          description: Содержимое комментария

    RobokassaConfirmPayment.request:
      type: object
      properties:
        OutSum:
          type: string
          description: Сумма платежа.
        InvId:
          type: integer
          description: Номер счета в магазине.
        Fee:
          type: number
          description: Комиссия Robokassa за совершение операции. Удерживается согласно тарифу клиента.
        EMail:
          type: string
          format: email
          description: Email, указанный покупателем при оплате.
        SignatureValue:
          type: string
          description: Контрольная сумма — хэш, число в 16-ричной форме (0–9, A–F), рассчитанное методом, указанным в технических настройках магазина.
        PaymentMethod:
          type: string
          description: Способ оплаты, использованный пользователем.
        IncCurrLabel:
          type: string
          description: Валюта, которой платил клиент.
        Shp_:
          type: object
          additionalProperties:
            type: string
          description: Пользовательские параметры, возвращаются, если были переданы при старте платежа.
      required:
        - OutSum
        - InvId
        - SignatureValue

    Tags:
      type: array
      items:
        type: string
      description: Поисковые теги

    Error:
      type: object
      properties:
        details:
          type: string
          description: Детали ошибки

    AuthToken:
      type: string
      description: Токен аутентификации

  securitySchemes:
    auth:
      type: http
      scheme: bearer
    reset:
      description: Токен для сброса пароля, отправленный пользователю на почту
      type: http
      scheme: bearer
    trust:
      description: Доверительный токен, подтверждающий легитимность загруженных Антифродом наблюдений. Наличие токена гарантирует, что пользователь ранее аутентифицировался.
      type: http
      scheme: bearer