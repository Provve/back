buildscript {
    dependencies {
        classpath libs.jdbc.postgres
        classpath libs.flyway.postgres
    }
}

plugins {
    alias(libs.plugins.flyway)
    alias(libs.plugins.jooq)
    id 'common-java'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation project(':events')
    implementation project(':statemachine')
    implementation project(':s3')
    implementation libs.bundles.docker
    implementation libs.failsafe

    compileOnly project(':skill')
}
